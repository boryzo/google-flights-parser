name: round-trip-flight-test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  flight-rt-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run round-trip integration test
        run: pytest -s --log-cli-level=DEBUG tests/test_round_trip_gdn_jfk.py
      
      - name: Upload fast_flights debug dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-flights-dumps
          path: |
            /tmp/fast_flights_listing.html
            /tmp/fast_flights_listing_snippet.txt      
