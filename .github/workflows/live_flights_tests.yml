name: live-flights-tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 */2 * *"

jobs:
  live-flights-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run live + decoder tests (HTML report)
        run: |
          python scripts/run_pytest_html.py \
            -s --log-cli-level=DEBUG \
            tests/test_round_trip_live_google.py \
            tests/test_one_way_live_google.py \
            tests/test_round_trip_js_flow.py
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/pytest_report.html
            reports/pytest_junit.xml
            /tmp/fast_flights_listing.html
            /tmp/fast_flights_listing_snippet.txt
